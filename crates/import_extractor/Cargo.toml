[package]
name = "gazelle-rs-import-extractor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["cargo"]
cargo = []

[dependencies]
syn.workspace = true
prost.workspace = true
# Keep derive compatible with rules_rs's prost runtime.
prost-derive = "=0.13.1"

[build-dependencies]
prost-build = "=0.13.1"
protoc-bin-vendored = "3"
